<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis 15 Años - Alysson Valeria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #cba135;
      --gold-dark: #997521;
      --blue-navy: #1b365d;
      --blue-soft: #7094b7;
      --bg-floral: #f4f8fb;
      --card-bg: rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-floral);
      font-family: 'Montserrat', sans-serif;
      color: var(--blue-navy);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .invitation-card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 25px;
      box-shadow: 0 15px 35px rgba(27, 54, 93, 0.12);
      border: 1px solid rgba(203, 161, 53, 0.3);
      text-align: center;
      position: relative;
    }
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #ffffff;
      border: 1px solid var(--gold-primary);
      color: var(--gold-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      z-index: 10;
    }
    .monogram {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: var(--gold-primary);
      width: 70px;
      height: 70px;
      margin: 10px auto 15px;
      border: 2px dashed var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sub-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--blue-soft);
      margin-bottom: 5px;
    }
    .name {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: var(--gold-dark);
      margin-bottom: 10px;
      line-height: 1.1;
    }
    .date-row {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      margin: 20px 0 5px;
    }
    .date-num {
      font-size: 3rem;
      font-weight: 700;
      color: var(--gold-primary);
      margin: 0 8px;
    }
    .time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }
    .location-box {
      background: rgba(112, 148, 183, 0.08);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
    }
    .location-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .address {
      font-size: 0.85rem;
      color: #555;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    .btn-maps {
      background: #ffffff;
      color: #d93025;
      border: 1px solid #d93025;
    }
    .btn-whatsapp {
      background: #25d366;
      color: #ffffff;
    }
    /* Pantalla de bienvenida para desbloquear el audio */
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(27, 54, 93, 0.88);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      transition: opacity 0.6s ease;
    }
    .open-btn {
      background: var(--gold-primary);
      color: #fff;
      border: none;
      padding: 15px 35px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      margin-top: 20px;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Cortina para garantizar reproducción con sonido -->
  <div id="overlay">
    <div style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--gold-primary); margin-bottom: 10px;">Mis 15 Años</div>
    <div style="font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 20px;">ALYSSON VALERIA</div>
    <button class="open-btn" onclick="startExperience()">✉️ Abrir Invitación</button>
  </div>

  <div class="invitation-card">
    <button class="music-btn" id="musicBtn" onclick="toggleAudio()">
      <span id="musicIcon">⏸</span> <span id="musicText">Pausar</span>
    </button>

    <div class="monogram">a</div>
    <div class="sub-title">Mis 15 Años</div>
    <h1 class="name">Alysson Valeria</h1>

    <div class="date-row">
      Sábado <span class="date-num">28</span> Noviembre
    </div>
    <div class="time">08:30 P.M.</div>

    <div class="location-box">
      <div class="location-title">SALÓN DE RECEPCIONES HACIENDA ALESSA</div>
      <div class="address">Av. Los Ciruelos Nro 361 - San Juan de Lurigancho</div>
    </div>

    <div class="btn-group">
      <a href="https://maps.google.com/?q=Salon+de+Recepciones+Hacienda+Alessa+Av+Los+Ciruelos+361+San+Juan+de+Lurigancho" target="_blank" class="btn btn-maps">
        📍 Ver ubicación en Google Maps
      </a>
      <a href="https://wa.me/51994690158?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20a%20los%2015%20A%C3%B1os%20de%20Alysson%20Valeria." target="_blank" class="btn btn-whatsapp">
        💬 Confirmar por WhatsApp
      </a>
    </div>
  </div>

  <!-- Apunta exactamente al nombre music.mp3 que tienes en tu repositorio -->
  <audio id="bgAudio" src="music.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('bgAudio');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');
    const overlay = document.getElementById('overlay');

    function startExperience() {
      audio.play().then(() => {
        musicIcon.textContent = '⏸';
        musicText.textContent = 'Pausar';
      }).catch(err => {
        console.log("No se pudo iniciar automáticamente:", err);
      });

      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 600);
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        musicIcon.textContent = '⏸';
        musicText.textContent = 'Pausar';
      } else {
        audio.pause();
        musicIcon.textContent = '▶';
        musicText.textContent = 'Música';
      }
    }

    // Respaldo adicional: si tocan cualquier parte de la pantalla, arranca el sonido
    document.addEventListener('click', function unlockAudio() {
      if (audio.paused && overlay.style.display === 'none') {
        audio.play();
        musicIcon.textContent = '⏸';
        musicText.textContent = 'Pausar';
      }
    }, { once: true });
  </script>
</body>
</html>
